{% extends "base.html" %}

{% block header %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/general/ss_panel.css') }}">
    <title>سیستم حضور و غیاب</title>
{% endblock %}

{% block body %}
    <div class="alert" role="alert"></div>

    <div class="dashboard-container">
        <div class="dashboard-card">
            <h2 class="page-title">به سیستم حضور و غیاب خوش آمدید!</h2>

            <div class="user-info">
                <div class="info-item name">
                    <span class="label">نام و نام خانوادگی:</span>
                    <span class="value val-ul-n">در حال بارگذاری...</span>
                </div>
                <div class="info-item role">
                    <span class="label">نقش من:</span>
                    <span class="value val-ul-r">در حال بارگذاری...</span>
                </div>
            </div>

            <div class="chart-container" style="width: 100%; max-width: 900px; margin: 0 auto; height: 400px;">
                <canvas class="chart"></canvas>
            </div>
        </div>
    </div>
{% endblock %}

{% block script %}
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
    <script>
        const alertEl = document.querySelector(".alert");
        const chartCanvas = document.querySelector(".chart");

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const userResponse = await fetch("/api/userInfo");
                if (!userResponse.ok) throw new Error();
                const user = await userResponse.json();

                document.querySelector(".val-ul-n").textContent = user.FullName || "-";
                document.querySelector(".val-ul-r").textContent = convertRole(user.UserLevel);

                const summaryResponse = await fetch("/api/absenceSummary");
                if (!summaryResponse.ok) throw new Error();
                const summary = await summaryResponse.json();

                const labels = summary.classes.map(item => item.classNumber);
                const values = summary.classes.map(item => item.absenceCount);

                new Chart(chartCanvas.getContext("2d"), {
                    type: "bar",
                    data: {
                        labels,
                        datasets: [{
                            label: "تعداد دانش‌آموزان غایب هر کلاس",
                            data: values,
                            backgroundColor: "rgba(255, 159, 64, 0.7)",
                            borderColor: "rgba(0, 0, 0, 1)",
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { precision: 0 }
                            }
                        }
                    }
                });
            } catch (error) {
                showAlert(alertEl, "دریافت اطلاعات حضور و غیاب با خطا مواجه شد.", "danger");
            }
        });

        function convertRole(level) {
            switch (level) {
                case 1: return "معلم";
                case 2: return "مدیر";
                case 3: return "مدیر ارشد";
                default: return "نامشخص";
            }
        }
    </script>
{% endblock %}
